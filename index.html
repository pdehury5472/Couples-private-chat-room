<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amour - Simple Couple Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- APP CONTAINER -->
  <div class="max-w-md mx-auto w-full min-h-screen bg-white shadow-md flex flex-col">

    <!-- HEADER -->
    <header class="p-4 border-b border-slate-100 flex items-center justify-between bg-rose-500 text-white">
      <div class="flex items-center gap-2">
        <i data-lucide="heart" class="w-5 h-5 fill-current"></i>
        <h1 class="font-bold text-lg">Amour</h1>
      </div>
      <span id="statusBadge" class="text-xs bg-rose-600 px-2.5 py-1 rounded-full font-medium">Offline</span>
    </header>

    <!-- STEP 1: JOIN / CREATE ROOM -->
    <div id="lobbyView" class="p-6 flex-1 flex flex-col justify-center space-y-6">
      <div class="text-center space-y-1">
        <h2 class="text-xl font-bold text-slate-900">Connect with Partner</h2>
        <p class="text-xs text-slate-500">Enter a 4-digit room code or paste an invite link</p>
      </div>

      <!-- Nickname Input -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Your Nickname</label>
        <input id="nicknameInput" type="text" value="Sweetheart" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-rose-400">
      </div>

      <!-- 4-Digit Code & Passcode Controls -->
      <div class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Room Code (4 Digits)</label>
          <input id="roomCodeInput" type="text" maxlength="4" placeholder="1234" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-center font-mono text-lg font-bold tracking-widest focus:outline-none focus:ring-2 focus:ring-rose-400">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Passcode (4 Digits)</label>
          <input id="passcodeInput" type="password" maxlength="4" placeholder="5678" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-center font-mono text-lg font-bold tracking-widest focus:outline-none focus:ring-2 focus:ring-rose-400">
        </div>

        <button onclick="generateRandomCodes()" class="text-xs text-rose-600 hover:underline flex items-center gap-1 font-medium mx-auto">
          <i data-lucide="refresh-cw" class="w-3 h-3"></i> Generate Random Codes
        </button>
      </div>

      <!-- Connect Button -->
      <button onclick="startConnection()" class="w-full py-3 bg-rose-500 hover:bg-rose-600 text-white font-semibold rounded-xl text-sm shadow-sm transition-all">
        Join or Create Room
      </button>

      <!-- Share Link Box -->
      <div class="pt-2 border-t border-slate-100 space-y-2">
        <label class="block text-xs text-slate-500 text-center">Or share an instant invite link</label>
        <button onclick="copyInviteLink()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg text-xs flex items-center justify-center gap-1.5">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy Invite Link
        </button>
      </div>
    </div>

    <!-- STEP 2: CHAT VIEW -->
    <div id="chatView" class="flex-1 flex flex-col hidden">
      <!-- Chat Sub-Header -->
      <div class="p-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between text-xs text-slate-600">
        <div>Chatting with: <strong id="partnerNameDisplay" class="text-slate-900">Partner</strong></div>
        <button onclick="leaveChat()" class="text-rose-600 font-semibold hover:underline">Leave</button>
      </div>

      <!-- Messages Stream -->
      <div id="messageStream" class="flex-1 p-4 overflow-y-auto space-y-3">
        <div class="text-center text-xs text-slate-400 my-2">Connection established. Messages are Peer-to-Peer.</div>
      </div>

      <!-- Input Bar -->
      <div class="p-3 border-t border-slate-200 flex items-center gap-2">
        <input id="messageTextInput" type="text" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()" class="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-rose-400">
        <button onclick="sendMessage()" class="p-2 bg-rose-500 text-white rounded-lg hover:bg-rose-600">
          <i data-lucide="send" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

  </div>

  <script>
    let peer = null;
    let conn = null;
    let myNickname = 'Sweetheart';
    let partnerNickname = 'Partner';

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      parseUrlHash();
    });

    // Generate random 4-digit Room Code and Passcode
    function generateRandomCodes() {
      const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
      const passcode = Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById('roomCodeInput').value = roomCode;
      document.getElementById('passcodeInput').value = passcode;
    }

    // Auto-fill codes if an invite link is opened
    function parseUrlHash() {
      const hash = window.location.hash.substring(1);
      if (hash) {
        const params = new URLSearchParams(hash);
        const room = params.get('room');
        const pass = params.get('pass');
        if (room && pass) {
          document.getElementById('roomCodeInput').value = room;
          document.getElementById('passcodeInput').value = pass;
        }
      } else {
        generateRandomCodes();
      }
    }

    function copyInviteLink() {
      const room = document.getElementById('roomCodeInput').value.trim();
      const pass = document.getElementById('passcodeInput').value.trim();
      if (room.length !== 4 || pass.length !== 4) {
        alert('Please enter valid 4-digit room code and passcode first.');
        return;
      }
      const url = `${window.location.origin}${window.location.pathname}#room=${room}&pass=${pass}`;
      navigator.clipboard.writeText(url);
      alert('Invite link copied to clipboard!');
    }

    function startConnection() {
      const room = document.getElementById('roomCodeInput').value.trim();
      const pass = document.getElementById('passcodeInput').value.trim();
      myNickname = document.getElementById('nicknameInput').value.trim() || 'Sweetheart';

      if (room.length !== 4 || pass.length !== 4) {
        alert('Both Room Code and Passcode must be exactly 4 digits.');
        return;
      }

      // Combine Room Code + Passcode into a single peer ID target
      const fullPeerId = `amour-${room}-${pass}`;

      document.getElementById('lobbyView').classList.add('hidden');
      document.getElementById('chatView').classList.remove('hidden');
      document.getElementById('statusBadge').innerText = 'Connecting...';

      // Initialize PeerJS with public STUN servers
      peer = new Peer({
        config: {
          iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        }
      });

      peer.on('open', (id) => {
        // Try connecting to partner using the combined code
        conn = peer.connect(fullPeerId);
        setupConnectionHandlers();

        // Also listen for incoming connections if partner joins later
        peer.on('connection', (incomingConn) => {
          conn = incomingConn;
          setupConnectionHandlers();
        });
      });
    }

    function setupConnectionHandlers() {
      conn.on('open', () => {
        document.getElementById('statusBadge').innerText = 'Connected';
        document.getElementById('statusBadge').className = 'text-xs bg-emerald-600 px-2.5 py-1 rounded-full font-medium';
        conn.send({ type: 'handshake', nickname: myNickname });
      });

      conn.on('data', (data) => {
        if (data.type === 'handshake') {
          partnerNickname = data.nickname;
          document.getElementById('partnerNameDisplay').innerText = partnerNickname;
        } else if (data.type === 'text') {
          renderMessage(data.text, 'partner');
        }
      });

      conn.on('close', () => {
        document.getElementById('statusBadge').innerText = 'Disconnected';
        document.getElementById('statusBadge').className = 'text-xs bg-rose-600 px-2.5 py-1 rounded-full font-medium';
      });
    }

    function sendMessage() {
      const input = document.getElementById('messageTextInput');
      const text = input.value.trim();
      if (!text || !conn) return;

      renderMessage(text, 'self');
      conn.send({ type: 'text', text });
      input.value = '';
    }

    function renderMessage(text, sender) {
      const stream = document.getElementById('messageStream');
      const isSelf = sender === 'self';
      const bubble = document.createElement('div');
      bubble.className = `flex ${isSelf ? 'justify-end' : 'justify-start'}`;
      bubble.innerHTML = `
        <div class="max-w-[80%] px-3 py-2 rounded-xl text-sm ${isSelf ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-800'}">
          ${text}
        </div>
      `;
      stream.appendChild(bubble);
      stream.scrollTop = stream.scrollHeight;
    }

    function leaveChat() {
      window.location.hash = '';
      window.location.reload();
    }
  </script>
</body>
</html>
