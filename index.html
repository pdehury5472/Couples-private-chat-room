<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Couple Chat & Video Call</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; margin: 0; }
    .container { padding: 15px; display: flex; flex-direction: column; flex: 1; max-width: 600px; margin: 0 auto; width: 100%; box-sizing: border-box; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
    input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
    button { background: #e91e63; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; margin-top: 10px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
    
    /* Video grid styling */
    .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; background: #000; padding: 10px; border-radius: 8px; }
    video { width: 100%; height: 160px; object-fit: cover; background: #222; border-radius: 6px; }
    
    #chat-box { flex: 1; background: #1a1a1a; border-radius: 8px; padding: 10px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; min-height: 150px; }
    .msg { margin: 5px 0; padding: 8px 12px; border-radius: 6px; max-width: 80%; }
    .me { background: #e91e63; align-self: flex-end; }
    .them { background: #333; align-self: flex-start; }
    .status { font-size: 0.9em; color: #888; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="setup-card">
      <h3>Private Chat & Video</h3>
      <p class="status" id="status-text">Generating room link...</p>
      
      <label>Share link with partner:</label>
      <input type="text" id="share-link" readonly onclick="this.select()">
      <button onclick="copyLink()">Copy Link</button>
    </div>

    <!-- Video Streams -->
    <div class="video-grid">
      <div>
        <small style="display:block; margin-bottom:4px;">You</small>
        <video id="local-video" autoplay muted playsinline></video>
      </div>
      <div>
        <small style="display:block; margin-bottom:4px;">Partner</small>
        <video id="remote-video" autoplay playsinline></video>
      </div>
    </div>
    
    <button id="call-btn" onclick="startCall()" disabled>📹 Start Video Call</button>

    <!-- Text Chat -->
    <div id="chat-box" style="margin-top: 10px;"></div>

    <div style="display: flex; gap: 5px;">
      <input type="text" id="msg-input" placeholder="Type a message..." disabled>
      <button style="width: 80px; margin: 0;" onclick="sendMessage()" id="send-btn" disabled>Send</button>
    </div>
  </div>

  <script>
    const peer = new Peer();
    let conn = null;
    let localStream = null;
    let partnerId = null;

    peer.on('open', (id) => {
      const shareUrl = window.location.origin + window.location.pathname + '#' + id;
      document.getElementById('share-link').value = shareUrl;
      document.getElementById('status-text').innerText = 'Ready! Share the link to connect.';

      // Connect automatically if link contains target ID
      if (window.location.hash) {
        partnerId = window.location.hash.substring(1);
        document.getElementById('status-text').innerText = 'Connecting to partner...';
        connectToPeer(partnerId);
      }
    });

    peer.on('connection', (incomingConn) => {
      conn = incomingConn;
      partnerId = incomingConn.peer;
      setupChat();
    });

    // Handle incoming video calls
    peer.on('call', async (call) => {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('local-video').srcObject = localStream;
        
        call.answer(localStream);
        call.on('stream', (remoteStream) => {
          document.getElementById('remote-video').srcObject = remoteStream;
        });
      } catch (err) {
        alert('Camera/Microphone access denied or unavailable.');
      }
    });

    function connectToPeer(targetId) {
      conn = peer.connect(targetId);
      setupChat();
    }

    function setupChat() {
      conn.on('open', () => {
        document.getElementById('status-text').innerText = 'Connected!';
        document.getElementById('msg-input').disabled = false;
        document.getElementById('send-btn').disabled = false;
        document.getElementById('call-btn').disabled = false;
      });

      conn.on('data', (data) => {
        appendMessage(data, 'them');
      });
    }

    async function startCall() {
      if (!partnerId) return;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('local-video').srcObject = localStream;

        const call = peer.call(partnerId, localStream);
        call.on('stream', (remoteStream) => {
          document.getElementById('remote-video').srcObject = remoteStream;
        });
      } catch (err) {
        alert('Could not access camera/microphone.');
      }
    }

    function sendMessage() {
      const input = document.getElementById('msg-input');
      if (input.value.trim() && conn) {
        conn.send(input.value);
        appendMessage(input.value, 'me');
        input.value = '';
      }
    }

    function appendMessage(text, side) {
      const box = document.getElementById('chat-box');
      const msg = document.createElement('div');
      msg.className = `msg ${side}`;
      msg.innerText = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }

    function copyLink() {
      const copyText = document.getElementById('share-link');
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert('Link copied to clipboard!');
    }
  </script>
</body>
</html>
